name: Build Resource Vision
on:
  push:
    branches: [resourcevision-build-1201]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod
        run: gradle --no-daemon clean remapJar
      - name: Inspect JAR
        run: |
          ls -l build/libs
          unzip -l build/libs/resourcevision-fabric-1.20.1-1.0.0.jar | head -45
      - uses: actions/upload-artifact@v4
        with:
          name: resourcevision-fabric-1.20.1-jar
          path: build/libs/resourcevision-fabric-1.20.1-1.0.0.jar
          if-no-files-found: error
